<div class="shell">
  <header class="header">
    <mat-toolbar class="toolbar">
      <!-- The filters live in the URL, so the panel holding them is furniture and can be put
           away. The count stays on the button: a rail that folds away with three facets set
           would leave a short table with nothing on screen explaining why. -->
      <button
        type="button"
        class="rail-toggle"
        (click)="toggleRail()"
        [attr.aria-expanded]="railOpen()"
        aria-controls="filter-rail"
        [attr.aria-label]="railToggleLabel()"
        [title]="railToggleLabel()"
      >
        <svg class="burger" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" />
        </svg>
        @if (activeFilterCount() > 0) {
          <span class="rail-badge num" aria-hidden="true">{{ activeFilterCount() }}</span>
        }
      </button>
      <span class="app-name">DSH Inspector</span>
      <nav class="tabs" aria-label="Sections">
        <!-- queryParamsHandling="preserve": the filters live in the query string, and a plain
             routerLink writes none, so every tab switch used to open the next screen unfiltered
             while the reader believed the rail still applied. -->
        @for (t of tabs; track t.key) {
          <a class="tab" [class.tab-active]="tabActive(t.key)" [routerLink]="t.link"
             queryParamsHandling="preserve">{{ t.label }}</a>
        }
      </nav>
      <span class="spacer"></span>
      @if (indexResult()) {
        <span class="index-result num">{{ indexResult() }}</span>
      }
      <!-- No mat-flat-button: the shell imports the toolbar and the progress bar, not the
           button module, so the attribute was inert and Chrome painted a native light button
           on a dark toolbar. The action is styled from the same tokens as the rest of the app
           instead; see styles.scss (.btn-primary) for why the M3 button would have been
            overridden anyway. -->
      <button
        type="button"
        class="btn btn-primary"
        (click)="reindex()"
        [disabled]="store.indexing()"
        [attr.aria-busy]="store.indexing()"
      >
        <svg class="action-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M13.6 8a5.6 5.6 0 1 1-1.7-4.05" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" />
          <path d="M13.4 1.6v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>{{ store.indexing() ? 'Indexing…' : 'Index sessions' }}</span>
      </button>
    </mat-toolbar>

    @if (store.busy() > 0) {
      <!-- Not [hidden]: Material sets display:block on the bar's own class, which beats the
           UA [hidden] rule, so an indeterminate bar marked hidden kept animating across an
           idle dashboard — the screen looked like it was always loading. -->
      <mat-progress-bar mode="indeterminate" class="busy-bar" aria-label="Loading"></mat-progress-bar>
    }

    @if (store.error()) {
      <div class="error-bar" role="alert">
        <span class="error-text">{{ store.error() }}</span>
        <button type="button" class="error-dismiss" aria-label="Dismiss error" (click)="dismissError()">×</button>
      </div>
    }

    @if (store.notice()) {
      <!-- role=status, not alert: a refused duplicate of a request that is already running is
           an announcement about the world, not a failure that needs interrupting. -->
      <div class="notice-bar" role="status">
        <span class="notice-text">{{ store.notice() }}</span>
        <button type="button" class="notice-dismiss" aria-label="Dismiss notice" (click)="dismissNotice()">×</button>
      </div>
    }
  </header>

  <div class="frame-body">
    <!-- The rail is outside the outlet: a route change swaps the outlet, never the filters.
         Removed from the DOM when it is shut rather than hidden with CSS, so its selects do
         not stay in the tab order behind a closed panel. -->
    @if (railOpen()) {
      <aside class="rail-pane" id="filter-rail" aria-label="Filters">
        <app-filter-rail />
      </aside>
    }
    <main class="outlet-pane" #outlet>
      <router-outlet />
    </main>
  </div>
</div>
