server:
  port: 8091
  address: 127.0.0.1

spring:
  application:
    name: dsh-inspector
  main:
    # Boot's "Starting … (<jar path> started by <user> in <directory>)" line is the one log line that
    # prints the username and the working directory on every start; the index's own summary line is
    # held to counts (DESIGN.md §4.1), and the startup banner is held to the same rule.
    log-startup-info: false
  datasource:
    # Deliberately a bare filename, not var/inspector.sqlite. sqlite-jdbc does not create a
    # missing parent directory, so a path with one makes the packaged jar die at startup with
    # SQLITE_CANTOPEN — and every test missed it, because each one overrides this URL to a temp
    # directory. A clone with no var/ would have shipped broken. ApplicationContextTest guards it.
    url: jdbc:sqlite:${inspector.db:inspector.sqlite}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
  # schema.sql is applied by inspector.store.SchemaGate, after the version gate and before
  # Hibernate validates the entities against it — spring.sql.init would run it too early, and on
  # an index written by an older build that order fails the boot instead of rebuilding the index.
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      # none here, validate in SchemaGate: validation has to wait for the version gate
      ddl-auto: none
    properties:
      hibernate:
        dialect: inspector.store.SqliteAffinityDialect
        jdbc:
          # A stream is written in one transaction as a few thousand rows; batching is what keeps
          # a full re-index in seconds. Only finding has a generated id, and it is the smallest table.
          batch_size: 500
        order_inserts: true

logging:
  level:
    # Hibernate's "Database info" line prints the JDBC URL, and the URL carries the database path —
    # under a home directory, the username. The same rule as every log line here: counts, never a
    # path (DESIGN.md §4.1). The line says nothing else an operator acts on.
    org.hibernate.orm.connections.pooling: WARN

inspector:
  corpus: fixtures/sessions
  harness-version: unknown
  evidence:
    store: true

management:
  endpoints:
    web:
      exposure:
        # health and nothing else — and this is the §4.1 privacy boundary showing up on the
        # management plane, not a tidy-up. Boot already exposes only health by default, so this
        # line is not what keeps the door shut today; it is what stops the door opening by
        # accident later. /actuator/env and /actuator/configprops print inspector.corpus and
        # inspector.db, both of which are absolute paths carrying the username in a real
        # deployment — the same thing the index log line is forbidden to print. One wildcard here
        # would hand that to anything that can reach port 8091.
        include: health
  endpoint:
    health:
      # Left at its default value (never) deliberately: a failing connection reports the JDBC
      # error text, and sqlite-jdbc puts the database file path in some of those messages. The
      # aggregate status is what a caller acts on; the reason belongs in the log.
      show-details: never
      group:
        # /actuator/health/readiness. The default group says only "the application started",
        # which for this tool is not the question anyone asks; adding db makes it answer "and the
        # index file answers a query", which is as close to ready as this application gets without
        # inventing a domain health indicator over the row counts.
        readiness:
          include: readinessState,db
